    150\" height=\"80\" fill=\"lightblue\" stroke=\"black\" stroke-width=\"2\"/>\n\
    \                <text x=\"175\" y=\"110\" text-anchor=\"middle\" font-size=\"\
    16\" font-weight=\"bold\">96</text>\n                <text x=\"175\" y=\"125\"\
    \ text-anchor=\"middle\" font-size=\"12\">quotient</text>\n                \n\
    \                <text x=\"300\" y=\"100\" font-size=\"14\" font-weight=\"bold\"\
    >R 3</text>\n                <text x=\"300\" y=\"120\" font-size=\"11\">remainder</text>\n\
    \                \n                <line x1=\"50\" y1=\"175\" x2=\"450\" y2=\"\
    175\" stroke=\"#ccc\" stroke-width=\"1\"/>\n                \n               \
