  question: List the first 5 multiples of $3$.
  options:
  - '[0, 3, 6, 9, 12, 15]'
  - '[6, 9, 12, 15, 18]'
  - '[3, 6, 9, 12, 15]'
  - '[3, 6, 9, 12, 18]'
  correct_answer: '[3, 6, 9, 12, 15]'
  difficulty: 2
  bloom_level: UNDERSTAND
  solution_steps:
  - 'Step 1: Multiply 3 by 1, 2, 3, ... to get multiples.'
  - 'Step 2: 3 × 1 = 3'
  - 'Step 3: 3 × 2 = 6'
  - 'Step 4: Continue the pattern...'
  - 'Step 5: The multiples are: 3, 6, 9, 12, 15'
  misconception_info:
  - misconception_type: INCOMPLETE_REASONING
    why_wrong: Student added 0 as the first multiple
    teaching_point: Multiples start at 1x the base number, not 0x
  - misconception_type: CONSTRAINT_VIOLATION
    why_wrong: Student skipped the first multiple
    teaching_point: The first multiple is the number itself (1x)
  - misconception_type: ARITHMETIC_ERROR
    why_wrong: Student miscounted the multiples
    teaching_point: List the exact number of multiples requested
  rich_content:
    story_problem: A multiple of 3 is any number you get by multiplying 3 by a whole
      number (1, 2, 3, ...). The first multiple is 3 × 1 = 3, the second is 3 × 2
      = 6, and so on. Notice we start with 1, not 0!
  visual_hints:
  - 'Multiples of 3 follow a pattern: 3, 6, 9, ...'
  - Each multiple is the previous one plus 3
  - 'First 5 multiples: 3, 6, 9, 12, 15'
