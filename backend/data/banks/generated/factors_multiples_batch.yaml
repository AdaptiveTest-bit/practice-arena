      2 = 24, and so on. Notice we start with 1, not 0!
  visual_hints:
  - 'Multiples of 12 follow a pattern: 12, 24, 36, ...'
  - Each multiple is the previous one plus 12
  - 'First 10 multiples: 12, 24, 36, 48, 60, 72, 84, 96, 108, 120'
  - 'Remember: 0 × 12 = 0 is NOT a multiple; we start from 1 × 12'
  - 'Check: Is each number in your list exactly divisible by 12?'
