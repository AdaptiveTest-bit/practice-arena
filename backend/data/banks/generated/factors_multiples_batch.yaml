  difficulty: 2
  bloom_level: UNDERSTAND
  solution_steps:
  - 'Step 1: Multiply 12 by 1, 2, 3, ... to get multiples.'
  - 'Step 2: 12 × 1 = 12'
  - 'Step 3: 12 × 2 = 24'
  - 'Step 4: Continue the pattern...'
  - 'Step 5: The multiples are: 12, 24, 36, 48, 60, 72, 84, 96, 108, 120'
  misconception_info:
