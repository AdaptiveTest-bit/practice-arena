- id: divisibility_cd31ed7d
  concept: divisibility
  question: Is 487 divisible by 10?
  options:
  - Partially
  - 'No'
  - Cannot determine
  - 'Yes'
  correct_answer: 'No'
  difficulty: 2
  bloom_level: UNDERSTAND
  solution_steps:
  - 'Number: 487'
  - 'Divisor: 10'
  - 'Rule for divisibility by 10: Last digit is 0'
  - 'Check: 487 / 10 = 48 remainder 7'
  - 'Result: NOT DIVISIBLE'
  misconception_info:
  - misconception_type: CONSTRAINT_VIOLATION
    why_wrong: Student thinks divisibility is not binary
    teaching_point: A number is either divisible or not - no 'partially'
  - misconception_type: INCOMPLETE_REASONING
    why_wrong: Student doesn't know the rule
    teaching_point: Learn the divisibility rules for each number
  - misconception_type: OPPOSITE_CONFUSION
    why_wrong: Student inverted the result
    teaching_point: 'Double-check: remainder 0 means divisible'
  rich_content:
    story_problem: 'To check if 487 is divisible by 10, we use the divisibility rule:
      Last digit is 0. A number is divisible by another if it divides evenly with
      no remainder. In this case, 487 ÷ 10 = 48 remainder 7, so 487 is NOT DIVISIBLE
      by 10.'
  visual_hints:
  - 'Divisibility rule for 10: Last digit is 0'
  - Apply the rule to 487
  - 'Perform the division: 487 ÷ 10 = 48 R7'
  - 'Check the remainder: 7'
  - 'Result: 487 is NOT DIVISIBLE ✗ by 10'
  rich_html_content: "\n        <div class=\"diagram divisibility-test\">\n      \
    \      <h4>Divisibility Test: 487 ÷ 10</h4>\n            <svg width=\"500\" height=\"\
    250\" style=\"border: 1px solid #ddd; margin: 10px 0;\">\n                <text\
    \ x=\"250\" y=\"30\" text-anchor=\"middle\" font-size=\"18\" font-weight=\"bold\"\
    >487 ÷ 10</text>\n                \n                <rect x=\"100\" y=\"60\" width=\"\
    150\" height=\"80\" fill=\"lightblue\" stroke=\"black\" stroke-width=\"2\"/>\n\
    \                <text x=\"175\" y=\"110\" text-anchor=\"middle\" font-size=\"\
    16\" font-weight=\"bold\">48</text>\n                <text x=\"175\" y=\"125\"\
    \ text-anchor=\"middle\" font-size=\"12\">quotient</text>\n                \n\
    \                <text x=\"300\" y=\"100\" font-size=\"14\" font-weight=\"bold\"\
    >R 7</text>\n                <text x=\"300\" y=\"120\" font-size=\"11\">remainder</text>\n\
    \                \n                <line x1=\"50\" y1=\"175\" x2=\"450\" y2=\"\
    175\" stroke=\"#ccc\" stroke-width=\"1\"/>\n                \n               \
    \ <text x=\"250\" y=\"210\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"\
    bold\" fill=\"#F44336\">✗ NOT DIVISIBLE</text>\n            </svg>\n         \
    \   <div style=\"margin: 15px 0; padding: 10px; background: #f9f9f9; border-left:\
    \ 4px solid #F44336;\">\n                <p><strong>Division Result:</strong></p>\n\
    \                <p style=\"font-size: 14px;\">487 = 10 × 48 + 7</p>\n       \
    \         <p style=\"font-size: 14px; color: #F44336; font-weight: bold;\">✗ NOT\
    \ DIVISIBLE</p>\n            </div>\n        </div>\n        "
- id: multiples_e030c396
  concept: multiples
  question: List the first 10 multiples of $5$.
  options:
  - '[5, 10, 15, 20, 25, 30, 35, 40, 45, 50]'
  - '[10, 15, 20, 25, 30, 35, 40, 45, 50, 55]'
  - '[5, 10, 15, 20, 25, 30, 35, 40, 45, 55]'
  - '[0, 5, 10, 15, 20, 25, 30, 35, 40, 45, 50]'
  correct_answer: '[5, 10, 15, 20, 25, 30, 35, 40, 45, 50]'
  difficulty: 2
  bloom_level: UNDERSTAND
  solution_steps:
  - 'Step 1: Multiply 5 by 1, 2, 3, ... to get multiples.'
  - 'Step 2: 5 × 1 = 5'
  - 'Step 3: 5 × 2 = 10'
  - 'Step 4: Continue the pattern...'
  - 'Step 5: The multiples are: 5, 10, 15, 20, 25, 30, 35, 40, 45, 50'
  misconception_info:
  - misconception_type: CONSTRAINT_VIOLATION
    why_wrong: Student skipped the first multiple
    teaching_point: The first multiple is the number itself (1x)
  - misconception_type: ARITHMETIC_ERROR
    why_wrong: Student miscounted the multiples
    teaching_point: List the exact number of multiples requested
  - misconception_type: INCOMPLETE_REASONING
    why_wrong: Student added 0 as the first multiple
    teaching_point: Multiples start at 1x the base number, not 0x
  rich_content:
    story_problem: A multiple of 5 is any number you get by multiplying 5 by a whole
      number (1, 2, 3, ...). The first multiple is 5 × 1 = 5, the second is 5 × 2
      = 10, and so on. Notice we start with 1, not 0!
  visual_hints:
  - 'Multiples of 5 follow a pattern: 5, 10, 15, ...'
  - Each multiple is the previous one plus 5
  - 'First 10 multiples: 5, 10, 15, 20, 25, 30, 35, 40, 45, 50'
  - 'Remember: 0 × 5 = 0 is NOT a multiple; we start from 1 × 5'
  - 'Check: Is each number in your list exactly divisible by 5?'
  rich_html_content: "\n        <div class=\"diagram multiples-sequence\">\n     \
    \       <h4>Multiples of 5</h4>\n            <svg width=\"500\" height=\"150\"\
    \ style=\"border: 1px solid #ddd; margin: 10px 0;\">\n                <text x=\"\
    10\" y=\"30\" font-size=\"14\" font-weight=\"bold\">Sequence:</text>\n       \
    \         <text x=\"10\" y=\"60\" font-size=\"14\" fill=\"#2196F3\">5 → 10 → 15\
    \ → 20 → 25 → 30 → ...</text>\n                <line x1=\"10\" y1=\"75\" x2=\"\
    490\" y2=\"75\" stroke=\"#ccc\" stroke-width=\"1\"/>\n                <text x=\"\
    10\" y=\"100\" font-size=\"12\">Each is 5 times a whole number</text>\n      \
    \      </svg>\n            <div style=\"margin: 15px 0; padding: 10px; background:\
    \ #f9f9f9; border-left: 4px solid #FF9800;\">\n                <p><strong>First\
    \ 10 multiples of 5:</strong></p>\n                <p style=\"font-size: 15px;\
    \ color: #FF5722;\">5, 10, 15, 20, 25, 30, 35, 40, 45, 50</p>\n            </div>\n\
