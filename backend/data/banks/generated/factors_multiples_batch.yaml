- id: hcf_593b2f40
  concept: hcf
  question: What is the GCD of 16 and 24?
  options:
  - '16'
  - '40'
  - '384'
  - '8'
  correct_answer: '8'
  difficulty: 2
  bloom_level: UNDERSTAND
  solution_steps:
  - 'Numbers: 16 and 24'
  - 'Factors of 16: [(2, 4)]'
  - 'Factors of 24: [(2, 3), (3, 1)]'
  - 'Common factors: (calculated)'
  - GCD(16, 24) = 8
  misconception_info:
  - misconception_type: INCOMPLETE_REASONING
    why_wrong: Student just took the smaller number
    teaching_point: The smaller number may not divide the larger one evenly
  - misconception_type: CONSTRAINT_VIOLATION
    why_wrong: Student added instead of finding GCD
    teaching_point: GCD is about divisibility, not addition
  - misconception_type: FORMULA_CONFUSION
    why_wrong: Student multiplied instead of finding GCD
    teaching_point: GCD is the largest divisor of both numbers
  rich_content:
    story_problem: To find the GCD (Greatest Common Divisor) of 16 and 24, we look
      for the largest number that divides both of them evenly. The GCD is 8, which
      means 8 divides both 16 and 24 with no remainder. This is the largest such divisor.
  visual_hints:
  - The GCD must divide both 16 and 24 evenly
  - 'List factors of 16: [2, 2, 2, 2] (prime factors)'
  - 'List factors of 24: [2, 2, 2, 3] (prime factors)'
  - Find common factors and multiply them together
  - The result is the GCD = 8
  rich_html_content: "\n        <div class=\"diagram gcd-factors\">\n            <h4>Finding\
    \ GCD(16, 24)</h4>\n            <svg width=\"500\" height=\"250\" style=\"border:\
    \ 1px solid #ddd; margin: 10px 0;\">\n                <text x=\"250\" y=\"25\"\
    \ text-anchor=\"middle\" font-size=\"16\" font-weight=\"bold\">Prime Factorization</text>\n\
    \                <text x=\"50\" y=\"70\" font-size=\"13\"><tspan font-weight=\"\
    bold\">16 =</tspan> 2 × 2 × 2 × 2</text>\n                <text x=\"50\" y=\"\
    100\" font-size=\"13\"><tspan font-weight=\"bold\">24 =</tspan> 2 × 2 × 2 × 3</text>\n\
    \                <line x1=\"20\" y1=\"120\" x2=\"480\" y2=\"120\" stroke=\"#ccc\"\
    \ stroke-width=\"1\"/>\n                <text x=\"50\" y=\"155\" font-size=\"\
    13\" fill=\"#4CAF50\"><tspan font-weight=\"bold\">GCD =</tspan> 8</text>\n   \
