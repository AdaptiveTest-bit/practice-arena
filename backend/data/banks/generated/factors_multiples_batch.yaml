  concept: factors
  question: Find all factors of $93$.
  options:
  - '[1, 93]'
  - '[2, 3, 6, 11, 12, 13, 14, 15, 24, 29, 31, 32, 33, 34, 37, 41, 43, 45, 49, 53,
    55, 56, 61, 62, 64, 65, 66, 70, 72, 79, 80, 82, 84, 86, 87, 91, 93]'
  - '[3, 31]'
  - '[1, 3, 31, 93]'
  correct_answer: '[1, 3, 31, 93]'
  difficulty: 2
  bloom_level: UNDERSTAND
  solution_steps:
  - 'Step 1: Test which numbers divide 93 evenly.'
  - 'Step 2: Check each number from 1 to 93.'
  - 'Step 3: A number is a factor if 93 ÷ number has no remainder.'
  - 'Step 4: The factors are: 1, 3, 31, 93'
  misconception_info:
  - misconception_type: INCOMPLETE_REASONING
    why_wrong: Student only listed 1 and the number
    teaching_point: A factor is any number that divides evenly; test all numbers from
      1 to the target
  - misconception_type: CONSTRAINT_VIOLATION
    why_wrong: Student included numbers that don't divide the target evenly
    teaching_point: A factor must divide with NO remainder; check your division carefully
  - misconception_type: INCOMPLETE_REASONING
    why_wrong: Student forgot to include 1 and the number itself as factors
    teaching_point: 1 divides every number, and every number divides itself
