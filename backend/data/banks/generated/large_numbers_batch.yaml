- id: place_value_559880fa
  concept: place_value
  question: Round 671,418 to the nearest thousand
  options:
  - '671400'
  - '671000'
  - '672000'
  - Option 4
  correct_answer: '671000'
  difficulty: 2
  bloom_level: APPLY
  solution_steps:
  - 'Number: 671,418'
  - 'Nearest thousands: 671,000 and 672,000'
  - 'Check hundreds digit: 4'
  - Since 4 < 5, round DOWN
  - 'Answer: 671,000'
  misconception_info:
  - misconception_type: CONSTRAINT_VIOLATION
    why_wrong: Student used wrong place
    teaching_point: Round to NEAREST THOUSAND (1000)
  - misconception_type: ARITHMETIC_ERROR
    why_wrong: Student over-rounded
    teaching_point: Only round up if hundreds digit is ≥5
  rich_content:
    story_problem: 'K.C. Nag: Rounding is about approximation for practical use. When
      shopping, we often think in round numbers. Learn the rule: look at the digit
      to the right of the place you''re rounding to.'
    html_content: '<div style=''border:1px solid orange; padding:10px''><h4>Rounding
      Rule</h4><p>Hundreds digit 4: <5 round down</p><p>Answer: 671,000</p></div>'
    visual_hint: Find the thousands place
