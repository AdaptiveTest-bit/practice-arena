- id: rounding_3dee7775
  concept: rounding
  question: 'Cost price: Rs. 1933, Selling price: Rs. 1624. What is the loss?'
  options:
  - '1624'
  - '618'
  - '1933'
  - '309'
  correct_answer: '309'
  difficulty: 1
  bloom_level: REMEMBER
  solution_steps:
  - 'Cost Price (CP): Rs. 1933'
  - 'Selling Price (SP): Rs. 1624'
  - 'Difference: 309'
  - Since SP < CP, this is a loss
  - 'Answer: Rs. 309'
  misconception_info:
  - misconception_type: INCOMPLETE_REASONING
    why_wrong: Student returned SP instead of difference
    teaching_point: Profit = SP - CP, not just SP
  - misconception_type: ARITHMETIC_ERROR
    why_wrong: Student miscalculated
    teaching_point: Profit/Loss = Selling Price - Cost Price (single difference)
  - misconception_type: OPPOSITE_CONFUSION
    why_wrong: Student mixed up direction
    teaching_point: 'Profit: SP > CP (SP - CP = +). Loss: SP < CP (CP - SP = +)'
  rich_content:
    story_problem: 'K.C. Nag principle: Make profit/loss real. A shopkeeper buys goods
      at CP and sells at SP. If SP is higher, it''s profit (money gained). If CP is
      higher, it''s loss (money lost).'
    html_content: '<div style=''border:1px solid green; padding:10px''><h4>Profit/Loss
      Formula</h4><p>Profit = SP - CP</p><p>Loss = CP - SP</p><p>Your calculation:
      309</p></div>'
    visual_hint: 'Compare: CP = 1933, SP = 1624'
- id: rounding_cc4a1e83
  concept: rounding
  question: What is 5 lakh in standard notation?
  options:
  - '500000'
  - '105000'
  - '5000'
  - '10965671'
  correct_answer: '500000'
  difficulty: 3
  bloom_level: REMEMBER
  solution_steps:
  - 'Conversion type: lakh_to_standard'
  - 'Key facts: 1 lakh = 100,000 | 1 crore = 10 lakhs = 10,000,000'
  - 'Calculation: 1 crore = 1 × 10,000,000 = 10,000,000'
  - 'Adding: 5 lakh = 5 × 100,000 = 500,000'
  - 'Total: 10,500,000'
  misconception_info:
  - misconception_type: ARITHMETIC_ERROR
    why_wrong: Student used wrong multiplier
    teaching_point: 'Double-check: 1 lakh = 100,000; 1 crore = 10,000,000'
  - misconception_type: FORMULA_CONFUSION
    why_wrong: Student confused Indian and Western numbering
    teaching_point: 'Indian: 1 lakh = 1,00,000 | 1 crore = 1,00,00,000 (10 lakhs)'
  - misconception_type: INCOMPLETE_REASONING
    why_wrong: Student added instead of multiplied
    teaching_point: Conversion uses multiplication, not addition
  rich_content:
    story_problem: Understanding Indian numbering (lakh, crore) is essential for students
      in India. These are cultural mathematics - numbers that matter in our daily
      lives (population, money, distances).
    html_content: '<div style=''border:1px solid blue; padding:10px''><h4>Place Value
      Chart</h4><p>Crore: 1 | Lakh: 5</p><p>Standard: 10,500,000</p></div>'
    visual_hint: 1 lakh = 100,000 (5 zeros after 1)
