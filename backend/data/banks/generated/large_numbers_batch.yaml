- id: place_value_118076dc
  concept: place_value
  question: What is 39 lakh in standard notation?
  options:
  - '39000'
  - '34829210'
  - '339000'
  - '3900000'
  correct_answer: '3900000'
  difficulty: 4
  bloom_level: REMEMBER
  solution_steps:
  - 'Conversion type: lakh_to_standard'
  - 'Key facts: 1 lakh = 100,000 | 1 crore = 10 lakhs = 10,000,000'
  - 'Calculation: 3 crore = 3 × 10,000,000 = 30,000,000'
  - 'Adding: 39 lakh = 39 × 100,000 = 3,900,000'
  - 'Total: 33,900,000'
  misconception_info:
  - misconception_type: FORMULA_CONFUSION
    why_wrong: Student confused Indian and Western numbering
    teaching_point: 'Indian: 1 lakh = 1,00,000 | 1 crore = 1,00,00,000 (10 lakhs)'
  - misconception_type: INCOMPLETE_REASONING
    why_wrong: Student added instead of multiplied
    teaching_point: Conversion uses multiplication, not addition
  - misconception_type: ARITHMETIC_ERROR
    why_wrong: Student used wrong multiplier
    teaching_point: 'Double-check: 1 lakh = 100,000; 1 crore = 10,000,000'
  rich_content:
    story_problem: Understanding Indian numbering (lakh, crore) is essential for students
      in India. These are cultural mathematics - numbers that matter in our daily
      lives (population, money, distances).
    html_content: '<div style=''border:1px solid blue; padding:10px''><h4>Place Value
      Chart</h4><p>Crore: 3 | Lakh: 39</p><p>Standard: 33,900,000</p></div>'
    visual_hint: 1 lakh = 100,000 (5 zeros after 1)
