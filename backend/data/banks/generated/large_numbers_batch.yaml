- id: place_value_ab6b0c97
  concept: place_value
  question: 'Cost price: Rs. 4160, Selling price: Rs. 5865. What is the profit?'
  options:
  - '5865'
  - '1705'
  - '3410'
  - Option 4
  correct_answer: '1705'
  difficulty: 1
  bloom_level: UNDERSTAND
  solution_steps:
  - 'Cost Price (CP): Rs. 4160'
  - 'Selling Price (SP): Rs. 5865'
  - 'Difference: 1705'
  - Since SP > CP, this is a profit
  - 'Answer: Rs. 1705'
  misconception_info:
  - misconception_type: INCOMPLETE_REASONING
    why_wrong: Student returned SP instead of difference
    teaching_point: Profit = SP - CP, not just SP
  - misconception_type: ARITHMETIC_ERROR
    why_wrong: Student miscalculated
    teaching_point: Profit/Loss = Selling Price - Cost Price (single difference)
  rich_content:
    story_problem: 'K.C. Nag principle: Make profit/loss real. A shopkeeper buys goods
      at CP and sells at SP. If SP is higher, it''s profit (money gained). If CP is
      higher, it''s loss (money lost).'
    html_content: '<div style=''border:1px solid green; padding:10px''><h4>Profit/Loss
      Formula</h4><p>Profit = SP - CP</p><p>Loss = CP - SP</p><p>Your calculation:
      1705</p></div>'
    visual_hint: 'Compare: CP = 4160, SP = 5865'
- id: place_value_677e3729
  concept: place_value
  question: 'Compare: 9,583,863 and 578,806. Which is greater?'
  options:
  - Cannot determine
  - Equal
  - num2 > num1
  - num1 > num2
  correct_answer: num1 > num2
  difficulty: 3
  bloom_level: UNDERSTAND
  solution_steps:
  - 'Number 1: 9,583,863'
  - 'Number 2: 578,806'
  - Compare place by place (crore, lakh, thousand, ...)
  - 'Result: 9,583,863 > 578,806'
  misconception_info:
  - misconception_type: CONSTRAINT_VIOLATION
    why_wrong: Student doubts comparison rules
    teaching_point: We can always compare numbers exactly
  - misconception_type: INCOMPLETE_REASONING
    why_wrong: Student didn't check all digits
    teaching_point: Even if first digits match, check remaining digits
  - misconception_type: OPPOSITE_CONFUSION
    why_wrong: Student flipped the comparison
    teaching_point: Compare digit by digit from left to right
  rich_content:
    story_problem: 'K.C. Nag: Compare numbers like comparing heights. Taller person
      > shorter person. Bigger number > smaller number.'
    html_content: <div style='border:1px solid purple; padding:10px'><h4>Number Comparison</h4><p>9,583,863
      > 578,806</p></div>
    visual_hint: Write both numbers aligned
