- id: rounding_568cd40b
  concept: rounding
  question: 'Cost price: Rs. 1772, Selling price: Rs. 993. What is the loss?'
  options:
  - '1558'
  - '993'
  - '779'
  - '1772'
  correct_answer: '779'
  difficulty: 2
  bloom_level: APPLY
  solution_steps:
  - 'Cost Price (CP): Rs. 1772'
  - 'Selling Price (SP): Rs. 993'
  - 'Difference: 779'
  - Since SP < CP, this is a loss
  - 'Answer: Rs. 779'
  misconception_info:
  - misconception_type: ARITHMETIC_ERROR
    why_wrong: Student miscalculated
    teaching_point: Profit/Loss = Selling Price - Cost Price (single difference)
  - misconception_type: INCOMPLETE_REASONING
    why_wrong: Student returned SP instead of difference
    teaching_point: Profit = SP - CP, not just SP
  - misconception_type: OPPOSITE_CONFUSION
    why_wrong: Student mixed up direction
    teaching_point: 'Profit: SP > CP (SP - CP = +). Loss: SP < CP (CP - SP = +)'
  rich_content:
    story_problem: 'K.C. Nag principle: Make profit/loss real. A shopkeeper buys goods
      at CP and sells at SP. If SP is higher, it''s profit (money gained). If CP is
      higher, it''s loss (money lost).'
    html_content: '<div style=''border:1px solid green; padding:10px''><h4>Profit/Loss
      Formula</h4><p>Profit = SP - CP</p><p>Loss = CP - SP</p><p>Your calculation:
      779</p></div>'
    visual_hint: 'Compare: CP = 1772, SP = 993'
