  concept: number_comparison
  question: 'Cost price: Rs. 4702, Selling price: Rs. 6488. What is the profit?'
  options:
  - '1786'
  - '3572'
  - '6488'
  - Option 4
  correct_answer: '1786'
  difficulty: 4
  bloom_level: REMEMBER
  solution_steps:
  - 'Cost Price (CP): Rs. 4702'
  - 'Selling Price (SP): Rs. 6488'
  - 'Difference: 1786'
  - Since SP > CP, this is a profit
  - 'Answer: Rs. 1786'
  misconception_info:
  - misconception_type: ARITHMETIC_ERROR
    why_wrong: Student miscalculated
