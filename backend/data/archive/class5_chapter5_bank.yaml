# CLASS 5 - CHAPTER 5: BE MY MULTIPLE, I'LL BE YOUR FACTOR
# ==========================================================
# Premium Question Bank: 150+ questions with full pedagogy
# 
# Structure:
# - questions
#   - factors_multiples
#     - easy (20 questions)
#     - medium (6 questions)
#     - hard (4 questions)
#   - assertion_reason
#     - medium (10 questions)
#     - hard (20 questions)
#   - problem_solving
#     - hard (30 questions)
#
# Each question includes:
# - Core: question, options, correct_answer
# - Pedagogy: concept, misconception, teaching_point
# - Rendering: visual_hint, narrative_template, html_template
# - Assessment: bloom_level, difficulty, trap_type, solution_steps

questions:
  factors_multiples:
    easy:
      - id: "fm_001_factor_identification"
        question: "Which number is a factor of 18?"
        options: ["5", "6", "7", "11"]
        correct_answer: "6"
        concept: "Meaning of factors"
        concept_explanation: "A factor of a number is any number that divides it exactly (with no remainder)"
        misconception: "Confusing factors with multiples; thinking only 'middle' numbers are factors"
        misconception_type: "INCOMPLETE_REASONING"
        teaching_point: "Test each option: Does it divide 18 exactly? 18÷6=3 (yes), 18÷5=3.6 (no)"
        narrative_template: "factor_identification"
        visual_hint: "Try dividing 18 by each option. If remainder is 0, it's a factor."
        bloom_level: "REMEMBER"
        difficulty: 1
        trap_type: "CONTEXT_TRAP"
        why_effective: "Students confuse factors with multiples or think factors must be between the smallest and largest"
        how_to_avoid: "Systematically test each number: Is remainder 0?"
        solution_steps:
          - "To find factors of 18, test which numbers divide it evenly"
          - "18 ÷ 5 = 3.6 (remainder 3.6, not a factor)"
          - "18 ÷ 6 = 3 (exactly, so 6 IS a factor)"
          - "18 ÷ 7 = 2.57... (not a factor)"
          - "18 ÷ 11 = 1.63... (not a factor)"
          - "Therefore: 6 is a factor of 18"
        common_error: "Students choose 5 because it 'seems' like it should divide something"
        html_template: "factor_diagram"
        real_world_context: "Like organizing 18 apples: Can you make 6 equal groups? Yes (3 per group)"

      - id: "fm_002_factor_count"
        question: "How many factors does the number 10 have?"
        options: ["2", "3", "4", "5"]
        correct_answer: "4"
        concept: "Counting factors"
        concept_explanation: "Find ALL numbers that divide a number evenly, including 1 and the number itself"
        misconception: "Missing factor 1 or the number itself; forgetting to include both endpoints"
        misconception_type: "INCOMPLETE_REASONING"
        teaching_point: "Factors of 10 are: 1, 2, 5, 10 (total: 4). Don't forget 1 and 10!"
        narrative_template: "factor_counting"
        visual_hint: "List all divisors: 10÷1=10, 10÷2=5, 10÷5=2, 10÷10=1. That's 4 factors."
        bloom_level: "UNDERSTAND"
        difficulty: 1
        trap_type: "ASSUMPTION_TRAP"
        why_effective: "Many students only count 'middle' factors and forget the boundaries (1 and the number)"
        how_to_avoid: "ALWAYS check: 1 divides every number, and the number divides itself"
        solution_steps:
          - "Find all numbers that divide 10 exactly"
          - "10 ÷ 1 = 10 ✓ (1 is a factor)"
          - "10 ÷ 2 = 5 ✓ (2 is a factor)"
          - "10 ÷ 3 = 3.33... ✗ (not a factor)"
          - "10 ÷ 4 = 2.5 ✗ (not a factor)"
          - "10 ÷ 5 = 2 ✓ (5 is a factor)"
          - "10 ÷ 10 = 1 ✓ (10 is a factor)"
          - "Total factors: 1, 2, 5, 10 = 4 factors"
        common_error: "Students answer 2 because they only count 2 and 5, forgetting 1 and 10"
        html_template: "factor_listing"
        real_world_context: "Arranging 10 chairs: Can arrange in 1 row of 10, 2 rows of 5, 5 rows of 2, 10 rows of 1"

      - id: "fm_003_smallest_factor"
        question: "Which is the smallest factor of every number?"
        options: ["0", "1", "2", "The number itself"]
        correct_answer: "1"
        concept: "Smallest factor property"
        concept_explanation: "The number 1 divides every positive number exactly once"
        misconception: "Thinking 0 is a factor (division by 0 is undefined); or thinking the number itself is smallest"
        misconception_type: "CONCEPTUAL_ERROR"
        teaching_point: "1 is the universal factor: n÷1 = n for any number n. Zero cannot be a divisor (undefined)."
        narrative_template: "universal_property"
        visual_hint: "Question: Does any number have 1 as a divisor? YES! Every number divided by 1 equals itself."
        bloom_level: "UNDERSTAND"
        difficulty: 1
        trap_type: "ASSUMPTION_TRAP"
        why_effective: "Students confuse 'smallest' with 'smallest prime' or 'smallest non-trivial'"
        how_to_avoid: "Remember: 1 divides EVERYTHING. Zero is never a divisor (can't divide by zero)"
        solution_steps:
          - "Every positive number N can be written as: N = N ÷ 1"
          - "Therefore: 1 divides every number"
          - "1 is the smallest positive integer"
          - "1 is the smallest factor of every positive number"
        common_error: "Students choose 0 (wrong: can't divide by 0) or 2 (wrong: 2 doesn't divide odd numbers)"
        html_template: "universal_property_diagram"

      - id: "fm_004_number_divides_itself"
        question: "Which number is always a factor of itself?"
        options: ["0", "1", "The number", "10"]
        correct_answer: "The number"
        concept: "Self-divisibility property"
        concept_explanation: "Every number divides itself exactly once: N ÷ N = 1"
        misconception: "Thinking only specific numbers like 10 divide themselves"
        misconception_type: "INCOMPLETE_REASONING"
        teaching_point: "For ANY number N: N ÷ N = 1, so N is always a factor of itself"
        narrative_template: "self_divisibility"
        visual_hint: "For any number, ask: Does it divide into itself evenly? YES! Always gives quotient 1."
        bloom_level: "UNDERSTAND"
        difficulty: 1
        trap_type: "GENERALIZATION_ERROR"
        why_effective: "Students don't recognize this as a universal property applying to all numbers"
        how_to_avoid: "Test ANY number: 5÷5=1, 100÷100=1, 1000÷1000=1 ✓ Always works!"
        solution_steps:
          - "Consider any number N"
          - "Can N be divided by N? Yes"
          - "N ÷ N = 1 (exactly, no remainder)"
          - "Therefore: Every number is a factor of itself"
        common_error: "Students choose a specific number like 10, forgetting this applies to all numbers"
        html_template: "self_divisibility_diagram"

      - id: "fm_005_prime_identification"
        question: "Which of the following is a prime number?"
        options: ["9", "15", "7", "21"]
        correct_answer: "7"
        concept: "Prime number definition"
        concept_explanation: "A prime number has exactly 2 factors: 1 and itself. Cannot be divided by any other number."
        misconception: "Confusing prime with odd; thinking all odd numbers are prime"
        misconception_type: "INCOMPLETE_REASONING"
        teaching_point: "Prime: only 1 and itself. 9=3×3, 15=3×5, 21=3×7 are composite. 7 is prime."
        narrative_template: "prime_number"
        visual_hint: "Check factors: 7→(1,7); 9→(1,3,9); 15→(1,3,5,15); 21→(1,3,7,21)"
        bloom_level: "REMEMBER"
        difficulty: 1
        trap_type: "INCOMPLETE_REASONING"
        why_effective: "Many students conflate 'odd' with 'prime' - not realizing 9, 15, 21 are odd but composite"
        how_to_avoid: "List ALL factors. If exactly 2 factors, it's prime."
        solution_steps:
          - "Find all factors of each option"
          - "9: factors are 1, 3, 9 (3 factors - composite)"
          - "15: factors are 1, 3, 5, 15 (4 factors - composite)"
          - "7: factors are 1, 7 (2 factors - PRIME)"
          - "21: factors are 1, 3, 7, 21 (4 factors - composite)"
        common_error: "Students choose odd numbers like 9, 15, 21 thinking odd = prime"
        html_template: "prime_check_diagram"

      - id: "fm_006_neither_prime_nor_composite"
        question: "Which number is neither prime nor composite?"
        options: ["2", "4", "1", "9"]
        correct_answer: "1"
        concept: "Special case: number 1"
        concept_explanation: "1 has only ONE factor (itself), so it's neither prime (needs 2) nor composite (needs 3+)"
        misconception: "Treating 1 like any other number; not recognizing it as special"
        misconception_type: "CONCEPTUAL_ERROR"
        teaching_point: "Prime needs 2 distinct factors. Composite needs 3+. 1 has only 1 factor. SPECIAL CASE."
        narrative_template: "special_case"
        visual_hint: "1: factor is just 1. Not 2 factors (not prime). Not 3+ factors (not composite). UNIQUE."
        bloom_level: "UNDERSTAND"
        difficulty: 1
        trap_type: "ASSUMPTION_TRAP"
        why_effective: "1 is often overlooked or misclassified because it doesn't fit usual patterns"
        how_to_avoid: "Remember: Prime=exactly 2 factors, Composite=3+ factors, 1=exactly 1 factor (special)"
        solution_steps:
          - "Prime: exactly 2 factors (1 and itself)"
          - "Composite: 3 or more factors"
          - "Number 1: has only 1 factor (which is 1 itself)"
          - "1 doesn't fit either definition - it's NEITHER"
        common_error: "Students classify 1 as prime (it's not, 1 is too special)"
        html_template: "number_classification_diagram"

      - id: "fm_007_composite_identification"
        question: "Which of the following is a composite number?"
        options: ["11", "13", "17", "12"]
        correct_answer: "12"
        concept: "Composite number definition"
        concept_explanation: "Composite: has more than 2 factors. Can be divided by numbers other than 1 and itself."
        misconception: "Thinking even numbers are composite but odd numbers aren't"
        misconception_type: "INCOMPLETE_REASONING"
        teaching_point: "Composite has 3+ factors. 11,13,17 are prime (2 factors). 12=1,2,3,4,6,12 (6 factors)"
        narrative_template: "composite_number"
        visual_hint: "Composite = can be made by multiplying smaller numbers: 12=2×6=3×4=2×2×3"
        bloom_level: "REMEMBER"
        difficulty: 1
        trap_type: "INCOMPLETE_REASONING"
        why_effective: "All other options are prime; students must recognize 12 as the only one with multiple factors"
        how_to_avoid: "Check if the number can be divided by something other than 1 and itself"
        solution_steps:
          - "11: factors are 1, 11 (prime)"
          - "13: factors are 1, 13 (prime)"
          - "17: factors are 1, 17 (prime)"
          - "12: factors are 1, 2, 3, 4, 6, 12 (COMPOSITE - 6 factors)"
        common_error: "Students don't recognize that 12 can be broken into smaller factors"
        html_template: "composite_check_diagram"

      - id: "fm_008_prime_factor_identification"
        question: "Which is the prime factor of 12?"
        options: ["6", "4", "3", "12"]
        correct_answer: "3"
        concept: "Prime factors"
        concept_explanation: "Prime factors are the prime numbers that divide a number. 12=2×2×3, so prime factors are 2 and 3."
        misconception: "Confusing 'prime factor' with 'any factor'; thinking 6 and 4 are prime factors"
        misconception_type: "INCOMPLETE_REASONING"
        teaching_point: "Prime factors must be PRIME. 6=2×3 (not prime), 4=2×2 (not prime), 3 is prime."
        narrative_template: "prime_factorization"
        visual_hint: "Which is prime? 6(no:2×3), 4(no:2×2), 3(YES), 12(no:2×2×3)"
        bloom_level: "UNDERSTAND"
        difficulty: 1
        trap_type: "INCOMPLETE_REASONING"
        why_effective: "Students confuse 'a factor that appears in prime factorization' with 'any factor'"
        how_to_avoid: "Step 1: Check if the number is PRIME. Step 2: Check if it divides 12."
        solution_steps:
          - "12 = 2 × 2 × 3"
          - "Prime factors of 12 are: 2 and 3"
          - "Option 6 = 2×3 (not prime)"
          - "Option 4 = 2×2 (not prime)"
          - "Option 3 is prime AND divides 12"
          - "Answer: 3 is a prime factor of 12"
        common_error: "Students choose 6 or 4 (which ARE factors but NOT prime)"
        html_template: "prime_factorization_diagram"

      - id: "fm_009_prime_factorization"
        question: "What is the prime factorisation of 8?"
        options: ["2 × 4", "2 × 2 × 2", "1 × 8", "8 × 1"]
        correct_answer: "2 × 2 × 2"
        concept: "Prime factorization"
        concept_explanation: "Express a number as a product of only prime numbers. 8=2×2×2 (not 2×4 because 4 isn't prime)"
        misconception: "Using composite numbers in the factorization; stopping before all factors are prime"
        misconception_type: "INCOMPLETE_REASONING"
        teaching_point: "Prime factorization uses ONLY primes. 2 is prime. 4 is not (4=2×2). So 8=2×2×2."
        narrative_template: "prime_factorization"
        visual_hint: "Keep breaking down until EVERY factor is prime. 8→2×4→2×2×2 (all prime now)"
        bloom_level: "UNDERSTAND"
        difficulty: 1
        trap_type: "INCOMPLETE_REASONING"
        why_effective: "Students stop early using composite factors instead of continuing to prime factors"
        how_to_avoid: "After factorizing, check: Is EVERY factor prime? If no, keep breaking down."
        solution_steps:
          - "8 = 2 × 4"
          - "But 4 is not prime (4 = 2 × 2)"
          - "So continue: 8 = 2 × 2 × 2"
          - "Now all factors are prime"
          - "Prime factorization: 2 × 2 × 2"
        common_error: "Students write 2×4 or 1×8, forgetting these aren't fully prime factorizations"
        html_template: "factorization_tree_diagram"

      - id: "fm_010_multiple_identification"
        question: "Which number is a multiple of 6?"
        options: ["14", "18", "25", "35"]
        correct_answer: "18"
        concept: "Meaning of multiples"
        concept_explanation: "A multiple of N is any number that can be expressed as N × k (where k is a whole number)"
        misconception: "Confusing multiples with factors; thinking only larger numbers can be multiples"
        misconception_type: "INCOMPLETE_REASONING"
        teaching_point: "Multiples of 6: 6, 12, 18, 24, 30... Check: 18÷6=3 ✓ (yes, 18=6×3)"
        narrative_template: "multiple_identification"
        visual_hint: "Multiples of 6 are: 6, 12, 18, 24, 30, 36... Divide the option by 6. If no remainder, it's a multiple."
        bloom_level: "REMEMBER"
        difficulty: 1
        trap_type: "CONTEXT_TRAP"
        why_effective: "Similar surface structure to factor questions confuses students"
        how_to_avoid: "Multiple: Does 6 divide into it evenly? Divide the BIG number by the small one."
        solution_steps:
          - "To find multiples of 6, check if 6 divides evenly into each option"
          - "14 ÷ 6 = 2.33... (not a multiple)"
          - "18 ÷ 6 = 3 (exactly, so 18 IS a multiple)"
          - "25 ÷ 6 = 4.16... (not a multiple)"
          - "35 ÷ 6 = 5.83... (not a multiple)"
          - "Answer: 18"
        common_error: "Students confuse with factor questions; think factors and multiples work the same way"
        html_template: "multiple_sequence_diagram"
        real_world_context: "Counting by 6s: 6, 12, 18, 24... (like money: 6 rupees, 12 rupees, 18 rupees...)"

      - id: "fm_011_smallest_multiple"
        question: "What is the smallest multiple of any number?"
        options: ["1", "2", "The number itself", "0"]
        correct_answer: "0"
        concept: "Smallest multiple property"
        concept_explanation: "0 is a multiple of every number because 0 = k × 0 for any number k"
        misconception: "Thinking the number itself is the smallest (not recognizing 0)"
        misconception_type: "INCOMPLETE_REASONING"
        teaching_point: "Multiples of N: 0, N, 2N, 3N... because 0÷N=0 (0 is divisible by everything)"
        narrative_template: "universal_multiple"
        visual_hint: "Multiples of 6: 0, 6, 12, 18, 24... Zero is the smallest!"
        bloom_level: "UNDERSTAND"
        difficulty: 1
        trap_type: "ASSUMPTION_TRAP"
        why_effective: "Students often overlook 0 as a mathematical entity; think multiples start with the number itself"
        how_to_avoid: "Remember: 0 is a multiple of EVERY number (0 = 0×6, 0 = 0×100, etc.)"
        solution_steps:
          - "Is 0 a multiple of a number? Check: Can we write 0 = N × k?"
          - "Yes: 0 = N × 0 (k=0)"
          - "0 is divisible by every number"
          - "Multiples of any number: 0, then the number, then 2×number, 3×number..."
          - "Smallest multiple: 0"
        common_error: "Students say 'the number itself' (e.g., 6 is smallest multiple of 6) - forgetting about 0"
        html_template: "multiple_property_diagram"

      - id: "fm_012_infinite_multiples"
        question: "How many multiples does a number have?"
        options: ["5", "10", "100", "Infinite"]
        correct_answer: "Infinite"
        concept: "Property of multiples"
        concept_explanation: "For any number N, we can always find N×(k+1) for larger k, so there are infinitely many"
        misconception: "Thinking multiples are finite like factors"
        misconception_type: "CONCEPTUAL_ERROR"
        teaching_point: "Factors are finite. Multiples are infinite. For any N: we can always make a bigger multiple."
        narrative_template: "infinite_property"
        visual_hint: "Multiples of 5: 0, 5, 10, 15, 20, 25... keep going forever!"
        bloom_level: "UNDERSTAND"
        difficulty: 1
        trap_type: "CONCEPT_CONFUSION"
        why_effective: "Students confuse the properties of factors and multiples - opposite infinity properties"
        how_to_avoid: "Factors=finite (limited by the number itself). Multiples=infinite (can keep multiplying)"
        solution_steps:
          - "Multiples of 5: 5×1=5, 5×2=10, 5×3=15, 5×4=20..."
          - "For any multiple 5×k, we can always create 5×(k+1) which is larger"
          - "This process never ends"
          - "Therefore: Infinite multiples"
        common_error: "Students answer 5, 10, or 100 (thinking there's a limit like with factors)"
        html_template: "infinite_sequence_diagram"

      - id: "fm_013_common_factor"
        question: "Which of the following is a common factor of 12 and 18?"
        options: ["5", "6", "7", "11"]
        correct_answer: "6"
        concept: "Common factors"
        concept_explanation: "A common factor divides BOTH numbers. 12: {1,2,3,4,6,12}, 18: {1,2,3,6,9,18}, Common: {1,2,3,6}"
        misconception: "Confusing with individual factors; not checking both numbers"
        misconception_type: "INCOMPLETE_REASONING"
        teaching_point: "Common factor must divide BOTH 12 AND 18. Check: 12÷6=2✓, 18÷6=3✓. Both work!"
        narrative_template: "common_factor"
        visual_hint: "Does it divide 12? Does it divide 18? Must be YES for both."
        bloom_level: "UNDERSTAND"
        difficulty: 1
        trap_type: "CONTEXT_TRAP"
        why_effective: "Students test one number but forget to verify the second"
        how_to_avoid: "For COMMON factor: TEST BOTH NUMBERS. Divide both by the option."
        solution_steps:
          - "Check which option divides BOTH 12 and 18"
          - "5: 12÷5=2.4✗, 18÷5=3.6✗ (neither works)"
          - "6: 12÷6=2✓, 18÷6=3✓ (both work!)"
          - "7: 12÷7=1.7..✗ (doesn't work)"
          - "11: 12÷11=1.09..✗ (doesn't work)"
          - "Answer: 6 is a common factor"
        common_error: "Students choose 5 or 7 by only checking one number"
        html_template: "common_factor_diagram"

      - id: "fm_014_hcf_basic"
        question: "What is the HCF of 8 and 12?"
        options: ["2", "3", "4", "6"]
        correct_answer: "4"
        concept: "HCF (basic)"
        concept_explanation: "HCF=Highest Common Factor. The largest number that divides both 8 and 12."
        misconception: "Choosing common factor but not the HIGHEST one"
        misconception_type: "INCOMPLETE_REASONING"
        teaching_point: "Common factors of 8,12: {1,2,4}. Highest=4. Verify: 8÷4=2, 12÷4=3 ✓"
        narrative_template: "hcf_introduction"
        visual_hint: "Factors of 8: 1,2,4,8. Factors of 12: 1,2,3,4,6,12. Common: 1,2,4. Highest: 4"
        bloom_level: "UNDERSTAND"
        difficulty: 2
        trap_type: "INCOMPLETE_REASONING"
        why_effective: "Students find A common factor but not the HIGHEST one"
        how_to_avoid: "Find ALL common factors first. Then pick the largest."
        solution_steps:
          - "Factors of 8: 1, 2, 4, 8"
          - "Factors of 12: 1, 2, 3, 4, 6, 12"
          - "Common factors: 1, 2, 4"
          - "Highest Common Factor: 4"
        common_error: "Students answer 2 (which IS a common factor, but not the highest)"
        html_template: "hcf_venn_diagram"

      - id: "fm_015_hcf_method"
        question: "Which method is used to find HCF?"
        options: ["Multiplication", "Prime factorisation", "Addition", "Subtraction"]
        correct_answer: "Prime factorisation"
        concept: "HCF methods"
        concept_explanation: "Prime factorization method: Find prime factors of both, multiply common ones"
        misconception: "Confusing with other methods or not knowing systematic approaches"
        misconception_type: "PROCEDURAL_ERROR"
        teaching_point: "Methods: (1) List all factors (2) Prime factorization (3) Euclidean algorithm. Factorization is most reliable."
        narrative_template: "method_selection"
        visual_hint: "To find HCF of 12 and 18: 12=2²×3, 18=2×3². Common: 2¹×3¹=6"
        bloom_level: "UNDERSTAND"
        difficulty: 2
        trap_type: "PROCEDURAL_ERROR"
        why_effective: "Students don't know OR confuse systematic methods"
        how_to_avoid: "Memorize: HCF → Prime factorization (most systematic)"
        solution_steps:
          - "Multiple methods exist:"
          - "1. Listing: Find all factors of both, pick largest common"
          - "2. Prime factorization: Factor both, multiply shared factors"
          - "3. Euclidean algorithm: Repeated division"
          - "Most reliable and systematic: Prime factorisation"
        common_error: "Students pick Multiplication or Addition thinking math always uses all operations"
        html_template: "method_comparison_diagram"

      - id: "fm_016_common_multiple"
        question: "Which of the following is a common multiple of 4 and 6?"
        options: ["8", "12", "16", "20"]
        correct_answer: "12"
        concept: "Common multiples"
        concept_explanation: "A multiple that is divisible by BOTH 4 and 6"
        misconception: "Confusing with individual multiples; not checking both numbers"
        misconception_type: "INCOMPLETE_REASONING"
        teaching_point: "Common multiples of 4 & 6: 12, 24, 36... Check: 12÷4=3✓, 12÷6=2✓"
        narrative_template: "common_multiple"
        visual_hint: "Multiples of 4: 4,8,12,16,20,24... Multiples of 6: 6,12,18,24... Common: 12,24..."
        bloom_level: "UNDERSTAND"
        difficulty: 2
        trap_type: "CONTEXT_TRAP"
        why_effective: "Surface similarity to common factors confuses students"
        how_to_avoid: "For COMMON multiple: Must be divisible by BOTH numbers."
        solution_steps:
          - "Check which option is divisible by BOTH 4 and 6"
          - "8: Divisible by 4✓ but 8÷6=1.33✗"
          - "12: Divisible by 4✓ AND divisible by 6✓"
          - "16: Divisible by 4✓ but 16÷6=2.66✗"
          - "20: Divisible by 4✓ but 20÷6=3.33✗"
          - "Answer: 12"
        common_error: "Students choose 8, 16, or 20 (multiples of 4 but not 6)"
        html_template: "common_multiple_diagram"

      - id: "fm_017_lcm_basic"
        question: "What is the LCM of 3 and 4?"
        options: ["6", "8", "12", "24"]
        correct_answer: "12"
        concept: "LCM (basic)"
        concept_explanation: "LCM=Least Common Multiple. The smallest number divisible by both 3 and 4."
        misconception: "Choosing a common multiple but not the LEAST/SMALLEST one"
        misconception_type: "INCOMPLETE_REASONING"
        teaching_point: "Common multiples of 3,4: 12,24,36... Least/smallest=12. Verify: 12÷3=4, 12÷4=3 ✓"
        narrative_template: "lcm_introduction"
        visual_hint: "Multiples of 3: 3,6,9,12... Multiples of 4: 4,8,12... First common: 12"
        bloom_level: "UNDERSTAND"
        difficulty: 2
        trap_type: "INCOMPLETE_REASONING"
        why_effective: "Students find A common multiple but not the LEAST one"
        how_to_avoid: "Find ALL common multiples first. Then pick the smallest."
        solution_steps:
          - "Multiples of 3: 3, 6, 9, 12, 15, 18, 21, 24..."
          - "Multiples of 4: 4, 8, 12, 16, 20, 24..."
          - "Common multiples: 12, 24, 36..."
          - "Least Common Multiple: 12"
        common_error: "Students answer 24 (which IS a common multiple, but not the least)"
        html_template: "lcm_multiples_diagram"

      - id: "fm_018_lcm_method"
        question: "Which method is used to find LCM?"
        options: ["Division", "Listing multiples", "Subtraction", "Rounding"]
        correct_answer: "Listing multiples"
        concept: "LCM methods"
        concept_explanation: "LCM methods: (1) Listing multiples (2) Prime factorization (3) Division"
        misconception: "Confusing with HCF methods or other operations"
        misconception_type: "PROCEDURAL_ERROR"
        teaching_point: "For LCM, we CAN list multiples for small numbers. For larger: use prime factorization."
        narrative_template: "method_selection"
