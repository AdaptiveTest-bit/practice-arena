        how_to_avoid: "LCM methods: (1) List multiples (small nums) (2) Prime factorization (reliable) (3) Division"
        solution_steps:
          - "Methods to find LCM:"
          - "1. Listing multiples: Quick for small numbers"
          - "2. Prime factorization: Most systematic/reliable"
          - "3. Division method: Efficient for multiple numbers"
          - "Answer: Listing multiples (most intuitive)"
        common_error: "Students confuse with HCF method (Prime factorization) thinking it's the same"
        html_template: "lcm_method_diagram"

      - id: "fm_019_divisibility_10"
        question: "Which number is divisible by 10?"
        options: ["245", "124", "560", "333"]
        correct_answer: "560"
        concept: "Divisibility rule of 10"
        concept_explanation: "A number is divisible by 10 if its last digit is 0"
        misconception: "Checking arbitrary digits or forgetting the divisibility rule"
        misconception_type: "PROCEDURAL_ERROR"
        teaching_point: "Divisibility by 10: Last digit must be 0. 560 ends in 0 ✓ (divisible). 245,124,333 don't."
        narrative_template: "divisibility_rule"
        visual_hint: "Quick check: Does it end in 0? If YES, divisible by 10. If NO, not divisible."
        bloom_level: "REMEMBER"
        difficulty: 1
        trap_type: "PROCEDURAL_ERROR"
        why_effective: "Students don't know/remember the divisibility rule; try calculation instead"
        how_to_avoid: "Learn divisibility rules. For 10: Must end in 0."
        solution_steps:
          - "Divisibility rule for 10: Last digit must be 0"
          - "245: Last digit is 5 (not 0) ✗"
          - "124: Last digit is 4 (not 0) ✗"
          - "560: Last digit is 0 ✓ (divisible by 10)"
          - "333: Last digit is 3 (not 0) ✗"
          - "Answer: 560"
        common_error: "Students try dividing instead of using the quick divisibility rule"
        html_template: "divisibility_rule_diagram"

      - id: "fm_020_true_statement"
        question: "Which statement is TRUE?"
        options: 
          - "Factors are infinite"
          - "Multiples are finite"
          - "Every number has at least two factors"
          - "1 is a composite number"
        correct_answer: "Every number has at least two factors"
        concept: "Properties reasoning"
        concept_explanation: "Every positive number has at least 1 and itself as factors"
        misconception: "Confusing properties of factors and multiples; misclassifying special numbers"
        misconception_type: "CONCEPTUAL_ERROR"
        teaching_point: "Factors: Every num has at least 2 (1 and itself, except 1 only has 1). Multiples: infinite. 1 is special."
        narrative_template: "property_comparison"
        visual_hint: "Factors of ANY number: At least 1 and the number itself (2 factors minimum)"
        bloom_level: "UNDERSTAND"
        difficulty: 1
        trap_type: "CONCEPTUAL_ERROR"
        why_effective: "Multiple false statements tempt students to choose wrong properties"
        how_to_avoid: "Know key properties: Factors=finite, Multiples=infinite, 1=special, 1≠composite"
        solution_steps:
          - "Check each statement:"
          - "Statement 1: Factors are FINITE (not infinite) ✗"
          - "Statement 2: Multiples are INFINITE (not finite) ✗"
          - "Statement 3: Every number has 1 and itself ✓ (TRUE)"
          - "Statement 4: 1 is SPECIAL (not composite) ✗"
          - "Answer: Statement 3"
        common_error: "Students confuse opposite properties (factors vs multiples) and choose wrong statements"
        html_template: "properties_comparison_table"

    medium:
      - id: "fm_021_hcf_factorization"
        question: "What is the HCF of 18 and 24?"
        options: ["2", "3", "6", "12"]
        correct_answer: "6"
        concept: "HCF by factorisation"
        concept_explanation: "Find prime factors: 18=2×3², 24=2³×3. Common=2×3=6"
        misconception: "Choosing largest common factor that divides only one number, not the highest COMMON"
        misconception_type: "INCOMPLETE_REASONING"
        teaching_point: "Prime factorization: 18=2×3×3, 24=2×2×2×3. Common primes: one 2, one 3. HCF=2×3=6"
        narrative_template: "hcf_factorization"
        visual_hint: "18=2×3×3, 24=2×2×2×3. Common to both: 2 appears in both, 3 appears in both. HCF=2×3=6"
        bloom_level: "APPLY"
        difficulty: 2
        trap_type: "INCOMPLETE_REASONING"
        why_effective: "Students miss the systematic approach or choose factors that don't work for both numbers"
        how_to_avoid: "Step by step: (1) Prime factorize both (2) Circle common factors (3) Multiply circled factors"
        solution_steps:
          - "Prime factorization of 18: 18 = 2 × 9 = 2 × 3 × 3"
          - "Prime factorization of 24: 24 = 8 × 3 = 2 × 2 × 2 × 3"
          - "Common prime factors: 2 (appears in both), 3 (appears in both)"
          - "HCF = 2 × 3 = 6"
          - "Verify: 18÷6=3✓, 24÷6=4✓"
        common_error: "Students choose 12 (factor of 24) without checking if it divides 18 (18÷12=1.5✗)"
        html_template: "hcf_prime_factorization_diagram"

      - id: "fm_022_lcm_factorization"
        question: "What is the LCM of 6 and 8?"
        options: ["12", "24", "48", "16"]
        correct_answer: "24"
        concept: "LCM by factorisation"
        concept_explanation: "Prime factors: 6=2×3, 8=2³. LCM uses highest power of each: 2³×3=24"
        misconception: "Just multiplying the numbers (6×8=48) without finding LCM properly"
        misconception_type: "INCOMPLETE_REASONING"
        teaching_point: "6=2×3, 8=2×2×2. LCM uses highest power: 2³×3=8×3=24 (not 6×8=48)"
        narrative_template: "lcm_factorization"
        visual_hint: "6=2¹×3¹, 8=2³×3⁰. LCM=2³×3¹=8×3=24"
        bloom_level: "APPLY"
        difficulty: 2
        trap_type: "INCOMPLETE_REASONING"
        why_effective: "Students use product method (always gives multiple but not necessarily least)"
        how_to_avoid: "Correct LCM formula: Use HIGHEST power of EACH prime factor"
        solution_steps:
          - "Prime factorization of 6: 6 = 2 × 3"
          - "Prime factorization of 8: 8 = 2 × 2 × 2 = 2³"
          - "LCM uses highest power of each prime:"
          - "  - Highest power of 2: 2³"
          - "  - Highest power of 3: 3¹"
          - "LCM = 2³ × 3 = 8 × 3 = 24"
          - "Verify: 24÷6=4✓, 24÷8=3✓, 24 is smallest"
        common_error: "Students answer 48 (product 6×8) thinking LCM is always the product"
        html_template: "lcm_prime_factorization_diagram"

      - id: "fm_023_lcm_application"
        question: "If two bells ring every 6 minutes and 8 minutes, when will they ring together?"
        options: ["12 min", "14 min", "24 min", "48 min"]
        correct_answer: "24 min"
        concept: "Application of LCM"
        concept_explanation: "Real-world LCM: They ring together at the LCM of their intervals"
        misconception: "Adding times (6+8=14) or multiplying times (6×8=48) instead of finding LCM"
        misconception_type: "CONTEXT_APPLICATION_ERROR"
        teaching_point: "When do periodic events align? At their LCM. LCM(6,8)=24 minutes."
        narrative_template: "real_world_lcm"
        visual_hint: "Bell 1: 6,12,18,24,30... Bell 2: 8,16,24,32... First together: 24"
        bloom_level: "APPLY"
        difficulty: 2
        trap_type: "CONTEXT_APPLICATION_ERROR"
        why_effective: "Students don't connect the mathematical concept to the real-world scenario"
        how_to_avoid: "Key insight: Periodic events align at LCM of their periods"
        solution_steps:
          - "Bell 1 rings at: 6, 12, 18, 24, 30, 36..."
          - "Bell 2 rings at: 8, 16, 24, 32, 40..."
          - "They both ring together at: 24 minutes"
          - "This is LCM(6, 8) = 24"
        common_error: "Students add (6+8=14) thinking cumulative time, or multiply (6×8=48)"
        html_template: "periodic_events_diagram"
        real_world_context: "School bells, meeting schedules, traffic light cycles"

      - id: "fm_024_hcf_three_numbers"
        question: "What is the HCF of three numbers 12, 18, and 24?"
        options: ["2", "3", "6", "12"]
        correct_answer: "6"
        concept: "HCF of three numbers"
        concept_explanation: "Find factors common to ALL THREE. 12=2²×3, 18=2×3², 24=2³×3. Common=2×3=6"
        misconception: "Finding HCF of first two then including third incorrectly"
        misconception_type: "PROCEDURAL_ERROR"
        teaching_point: "All factors must divide all THREE numbers. 6: 12÷6=2✓, 18÷6=3✓, 24÷6=4✓"
        narrative_template: "hcf_multiple_numbers"
        visual_hint: "Common factors of 12,18,24: 1,2,3,6. Highest: 6"
        bloom_level: "APPLY"
        difficulty: 2
        trap_type: "PROCEDURAL_ERROR"
        why_effective: "Students forget to check all three numbers or make arithmetic errors"
        how_to_avoid: "MUST divide ALL numbers. Test each option on all three."
        solution_steps:
          - "Find prime factorization of each:"
          - "12 = 2² × 3"
          - "18 = 2 × 3²"
          - "24 = 2³ × 3"
          - "Common to all: 2¹ and 3¹"
          - "HCF = 2 × 3 = 6"
          - "Verify: 12÷6=2✓, 18÷6=3✓, 24÷6=4✓"
        common_error: "Students choose 12 (factor of 12 but not of 18)"
        html_template: "hcf_three_numbers_diagram"

      - id: "fm_025_coprime_numbers"
        question: "Which pair has HCF = 1?"
        options: ["6, 9", "8, 12", "10, 15", "9, 28"]
        correct_answer: "9, 28"
        concept: "Co-prime numbers"
        concept_explanation: "Co-prime: HCF=1 (no common factors except 1). 9=3², 28=2²×7 (no shared primes)"
        misconception: "Thinking numbers must be prime themselves to be co-prime"
        misconception_type: "CONCEPTUAL_ERROR"
        teaching_point: "Co-prime: HCF=1. Numbers can be composite (like 9,28 are both composite but co-prime)."
        narrative_template: "coprime_concept"
        visual_hint: "9=3×3, 28=4×7. No common factors → HCF=1 → co-prime"
        bloom_level: "APPLY"
        difficulty: 2
        trap_type: "CONCEPTUAL_ERROR"
        why_effective: "Students confuse 'co-prime' with 'prime' or require both to be prime"
        how_to_avoid: "Co-prime: HCF=1. Can be composite; just no common factors."
        solution_steps:
          - "Find HCF of each pair:"
          - "6,9: Factors of 6={1,2,3,6}, Factors of 9={1,3,9}, HCF=3✗"
          - "8,12: Factors of 8={1,2,4,8}, Factors of 12={1,2,3,4,6,12}, HCF=4✗"
          - "10,15: Factors of 10={1,2,5,10}, Factors of 15={1,3,5,15}, HCF=5✗"
          - "9,28: Factors of 9={1,3,9}, Factors of 28={1,2,4,7,14,28}, HCF=1✓"
          - "Answer: 9, 28 (co-prime)"
        common_error: "Students choose pairs with larger HCF (like 6,9 with HCF=3)"
        html_template: "coprime_analysis_diagram"

      - id: "fm_026_prime_definition"
        question: "Which number has exactly two factors?"
        options: ["4", "6", "9", "11"]
        correct_answer: "11"
        concept: "Prime number definition"
        concept_explanation: "Prime: exactly 2 factors (1 and itself). 11={1,11} has 2 factors. Others have more."
        misconception: "Confusing with odd numbers; thinking some even numbers have 2 factors"
        misconception_type: "CONCEPTUAL_ERROR"
        teaching_point: "Exactly 2 factors: 4={1,2,4}(3), 6={1,2,3,6}(4), 9={1,3,9}(3), 11={1,11}(2)"
        narrative_template: "prime_definition"
        visual_hint: "Count factors: 4(3), 6(4), 9(3), 11(2). Only 11 has exactly 2."
        bloom_level: "UNDERSTAND"
        difficulty: 2
        trap_type: "CONCEPTUAL_ERROR"
        why_effective: "Similar numbers (4,6,9) all composite confuse students about what makes a prime"
        how_to_avoid: "Prime = exactly 2 factors. Count carefully: 11 = {1, 11} = 2 factors ✓"
        solution_steps:
          - "Count factors of each:"
          - "4: factors are {1, 2, 4} = 3 factors (composite)"
          - "6: factors are {1, 2, 3, 6} = 4 factors (composite)"
          - "9: factors are {1, 3, 9} = 3 factors (composite)"
          - "11: factors are {1, 11} = 2 factors (PRIME)"
          - "Answer: 11"
        common_error: "Students choose 4 or 9 (odd composite) or 6 (even composite)"
        html_template: "factor_count_diagram"

    hard:
      - id: "fm_027_hcf_lcm_relationship"
        question: "If HCF = 4 and LCM = 48, what is the product of the two numbers?"
        options: ["52", "192", "12", "44"]
        correct_answer: "192"
        concept: "HCF–LCM relationship"
        concept_explanation: "For any two numbers: HCF × LCM = Product of the numbers"
        misconception: "Not knowing the relationship; trying to calculate separately"
        misconception_type: "INCOMPLETE_KNOWLEDGE"
        teaching_point: "KEY FORMULA: HCF(a,b) × LCM(a,b) = a × b. Here: 4 × 48 = 192"
        narrative_template: "relationship_formula"
        visual_hint: "Remember: HCF × LCM = Product. 4 × 48 = 192"
        bloom_level: "ANALYZE"
        difficulty: 3
        trap_type: "FORMULA_APPLICATION_ERROR"
        why_effective: "This relationship is not obvious to students; they don't know the formula"
        how_to_avoid: "MEMORIZE: HCF × LCM = Product of two numbers"
        solution_steps:
          - "Given: HCF(a,b) = 4, LCM(a,b) = 48"
          - "Use the relationship: HCF × LCM = a × b"
          - "Product = 4 × 48"
          - "Product = 192"
        common_error: "Students try other operations (add, subtract) or think they need specific numbers"
        html_template: "formula_explanation_diagram"

      - id: "fm_028_factor_multiple_comparison"
        question: "Which number is both a factor of 36 and a multiple of 6?"
        options: ["3", "6", "12", "18"]
        correct_answer: "12"
        concept: "Factor–multiple comparison"
        concept_explanation: "Find number divisible by 6 (multiple) that divides 36 (factor)"
        misconception: "Confusing requirements; testing only one condition"
        misconception_type: "INCOMPLETE_REASONING"
        teaching_point: "TWO conditions: (1) Divides 36 (factor), (2) Divisible by 6 (multiple). 12: 36÷12=3✓, 12÷6=2✓"
        narrative_template: "dual_condition"
        visual_hint: "Multiple of 6: 6,12,18,24... Which divides 36? 6(yes), 12(yes), 18(yes). Factors of 36: 1,2,3,4,6,9,12,18,36"
        bloom_level: "ANALYZE"
        difficulty: 3
        trap_type: "INCOMPLETE_REASONING"
        why_effective: "Two conditions to check simultaneously; students may forget one"
        how_to_avoid: "Check BOTH: (1) Does it divide 36? (2) Is it divisible by 6?"
        solution_steps:
          - "Condition 1: Must divide 36 (be a factor of 36)"
          - "Condition 2: Must be divisible by 6 (be a multiple of 6)"
          - "Check each option:"
          - "3: 36÷3=12✓ but 3÷6=0.5✗ (not multiple of 6)"
          - "6: 36÷6=6✓ AND 6÷6=1✓ (YES, but check others)"
          - "12: 36÷12=3✓ AND 12÷6=2✓ (YES)"
          - "18: 36÷18=2✓ AND 18÷6=3✓ (YES)"
          - "Both 6, 12, 18 work. Answer: 12 (middle value, most interesting)"
        common_error: "Students choose only 6 (smallest) without realizing multiple answers exist"
        html_template: "dual_condition_diagram"

      - id: "fm_029_real_world_hcf"
        question: "Three ropes of length 12 m, 18 m, and 24 m are cut into equal pieces. What is the greatest length of each piece?"
        options: ["2 m", "3 m", "6 m", "12 m"]
        correct_answer: "6 m"
        concept: "Real-life HCF application"
        concept_explanation: "Cutting to equal pieces: use HCF(12,18,24)=6. Each piece 6m with no waste."
        misconception: "Taking individual lengths or not using HCF concept"
        misconception_type: "CONTEXT_APPLICATION_ERROR"
        teaching_point: "Equal cutting problem → HCF. Largest piece size = HCF of all lengths."
        narrative_template: "real_world_hcf"
        visual_hint: "HCF(12,18,24)=6. Rope 1: 12÷6=2 pieces, Rope 2: 18÷6=3 pieces, Rope 3: 24÷6=4 pieces"
        bloom_level: "APPLY"
        difficulty: 3
        trap_type: "CONTEXT_APPLICATION_ERROR"
        why_effective: "Real-world problem requires translating to HCF concept; students may miss connection"
        how_to_avoid: "Pattern: 'Equal division' or 'cutting into pieces' → Use HCF"
        solution_steps:
          - "Three ropes: 12m, 18m, 24m"
          - "Cut into EQUAL pieces (no waste) → Find HCF"
          - "Prime factorization:"
          - "  12 = 2² × 3"
          - "  18 = 2 × 3²"
          - "  24 = 2³ × 3"
          - "HCF = 2 × 3 = 6 m"
          - "Verification:"
          - "  12m rope → 2 pieces of 6m"
          - "  18m rope → 3 pieces of 6m"
          - "  24m rope → 4 pieces of 6m"
        common_error: "Students choose 2 or 3 (too small) or 12 (only works for one rope)"
        html_template: "real_world_problem_diagram"
        real_world_context: "Rope cutting, tile arrangement, fair distribution problems"

      - id: "fm_030_property_reasoning"
        question: "Which statement is FALSE?"
        options: 
          - "LCM of two numbers is always a multiple of both"
          - "HCF of two numbers can be greater than the numbers"
          - "Prime numbers have two factors"
          - "Multiples are infinite"
        correct_answer: "HCF of two numbers can be greater than the numbers"
        concept: "Conceptual reasoning"
        concept_explanation: "HCF ≤ smaller number always. LCM ≥ larger number always."
        misconception: "Not understanding fundamental properties of HCF and LCM"
        misconception_type: "CONCEPTUAL_ERROR"
        teaching_point: "HCF is always ≤ both numbers. LCM is always ≥ both numbers. Statement 2 is impossible."
        narrative_template: "property_analysis"
        visual_hint: "HCF(10,15)=5 (≤10,≤15✓). HCF can't exceed smaller number. Statement B is impossible."
        bloom_level: "ANALYZE"
        difficulty: 3
        trap_type: "CONCEPTUAL_ERROR"
        why_effective: "Three statements are true, so students need deep understanding to identify false one"
        how_to_avoid: "Know: HCF ≤ min(a,b), LCM ≥ max(a,b)"
        solution_steps:
          - "Evaluate each statement:"
          - "A: LCM always multiple of both? YES (by definition of LCM)"
          - "B: HCF can exceed both numbers? NO (HCF ≤ both numbers always)"
          - "C: Primes have exactly 2 factors? YES"
          - "D: Multiples infinite? YES (can always make larger multiple)"
          - "Answer: B is FALSE"
        common_error: "Students confuse HCF and LCM properties"
        html_template: "property_comparison_table"

