    - id: factors_multiples_factors_find_factors_v42
      question: Find all factors of 72
      options:
      - '[1, 72]'
      - '[2, 3, 4, 6, 8, 9, 12, 18, 24, 36]'
      - '[72, 144, 216, 288]'
      - '[1, 2, 3, 4, 6, 8, 9, 12, 18, 24, 36, 72]'
      correct_answer: '[1, 2, 3, 4, 6, 8, 9, 12, 18, 24, 36, 72]'
      concept: factors
      bloom_level: UNDERSTAND
      difficulty: 1
      solution_steps:
      - Find all numbers that divide 72 evenly (with remainder 0)
      - 'Test: 72 ÷ 1 = 72 ✓'
      - 'Test: 72 ÷ 2 = 36.0 ✓'
      - Continue testing up to √72 ≈ 8
      - 'Factors of 72: [1, 2, 3, 4, 6, 8, 9, 12, 18, 24, 36, 72]'
      - 'Total: 12 factors'
      template_id: find_factors
      misconception_info:
      - value: '[2, 3, 4, 6, 8, 9, 12, 18, 24, 36]'
        type: INCOMPLETE_REASONING
        description: Missing boundary factors (1 and n)
        why_wrong: Forgot to include 1 and the number itself as factors
        teaching_point: 1 divides every number, and every number divides itself
      - value: '[1, 72]'
        type: INCOMPLETE_REASONING
        description: Only listed 1 and the number
        why_wrong: Only included the trivial factors
        teaching_point: Test ALL numbers from 1 to n to find factors
      - value: '[72, 144, 216, 288]'
        type: CONCEPTUAL_ERROR
        description: Listed multiples instead of factors
        why_wrong: Confused factors (divide into) with multiples (multiply by)
        teaching_point: Factors divide INTO the number; multiples are the number TIMES
          something
      narrative: Let's find all the numbers that divide evenly into 72.
      visual_hint: 'Test each number from 1 to 72: Does it divide with remainder 0?'
      real_world_context: Like arranging {n} items into equal groups
